[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lmnotespy"
version = "0.2.0"
description = "File-based LLM notebook system with SQLite sessions (FastMCP)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mcp = ["fastmcp"]
dev = ["pytest"]

[tool.setuptools]
packages = ["lmnotespy"]

[tool.setuptools.package-data]
lmnotespy = ["manual.md", "lmnotes.md"]